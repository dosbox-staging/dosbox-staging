name: Set up vcpkg

inputs:
  name_os:
    description: "Name or OS"
    required: true

  arch:
    description: "Architecture"
    required: true

  compiler:
    description: "Compiler"
    required: false
    default: ""

  compiler_vers:
    description: "Compiler version"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set vcpkg env variables
      shell: bash
      run: |
        echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" = "Windows" ]; then
          # Short, drive-root paths to stay under Windows' MAX_PATH limit --
          # vcpkg build trees nest deeply.
          echo "VCPKG_DOWNLOADS=C:\\vcpkg_downloads" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=C:\\vcpkg_bin_cache" >> "$GITHUB_ENV"
          echo "VCPKG_EXE=${VCPKG_INSTALLATION_ROOT}/vcpkg.exe" >> "$GITHUB_ENV"
        else
          echo "VCPKG_DOWNLOADS=${{ github.workspace }}/vcpkg_downloads" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg_bin_cache" >> "$GITHUB_ENV"
          echo "VCPKG_EXE=${VCPKG_INSTALLATION_ROOT}/vcpkg" >> "$GITHUB_ENV"
        fi
        echo "DOSBOX_VCPKG_BASELINE=$(jq -r .\"builtin-baseline\" ./vcpkg.json)" >> "$GITHUB_ENV"

    - name: Create vcpkg downloads directory
      shell: bash
      run: mkdir -p "${VCPKG_DOWNLOADS}"

    - name: Checkout vcpkg to baseline
      shell: bash
      run: |
        cd "${VCPKG_ROOT}"
        git reset --hard
        git fetch
        git checkout "$DOSBOX_VCPKG_BASELINE"

    - name: Bootstrap vcpkg
      shell: bash
      run: "${VCPKG_ROOT}/bootstrap-vcpkg.sh"

    - name: Print vcpkg version
      shell: bash
      run: "${VCPKG_ROOT}/vcpkg version"

    - name: Get vcpkg commit
      shell: bash
      run: |
        cd "${VCPKG_ROOT}"
        echo "VCPKG_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name:  Set vcpkg binary cache key
      id:    vcpkg_bin_cache_key
      shell: bash
      run: |
        if [ -n "${{ inputs.compiler }}" ]; then INPUTS_COMPILER="${{ inputs.compiler }}-"; fi
        if [ -n "${{ inputs.compiler_vers }}" ]; then INPUTS_COMPILER_VERS="${{ inputs.compiler_vers }}-"; fi
        echo "cacheKey=vcpkg-${VCPKG_SHORT_HASH}-bin-cache-${{ inputs.name_os }}-${{ inputs.arch }}-${INPUTS_COMPILER}${INPUTS_COMPILER_VERS}${ImageOS}-${ImageVersion}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}" >> $GITHUB_OUTPUT

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      id:   vcpkg_bin_cache
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key:  ${{ steps.vcpkg_bin_cache_key.outputs.cacheKey }}

    - name: Create binary cache directory
      if: ${{ steps.vcpkg_bin_cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

    # Per-OS key: downloads/tools/ has platform-specific binaries.
    # Compiler/ImageVersion are intentionally omitted -- tarballs are
    # toolchain-independent, so runner-image bumps shouldn't invalidate.
    - name:  Set vcpkg downloads cache key
      id:    vcpkg_downloads_cache_key
      shell: bash
      run: |
        echo "cacheKey=vcpkg-${VCPKG_SHORT_HASH}-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}" >> $GITHUB_OUTPUT

    - name: Restore vcpkg downloads cache
      uses: actions/cache@v4
      id:   vcpkg_downloads_cache
      with:
        path: ${{ env.VCPKG_DOWNLOADS }}
        key:  ${{ steps.vcpkg_downloads_cache_key.outputs.cacheKey }}

    # 'true' = cache hit; 'false' = miss.
    - name:  Report vcpkg cache status
      shell: bash
      run: |
        echo "vcpkg binary cache hit:    ${{ steps.vcpkg_bin_cache.outputs.cache-hit || 'false' }}"
        echo "vcpkg downloads cache hit: ${{ steps.vcpkg_downloads_cache.outputs.cache-hit || 'false' }}"
