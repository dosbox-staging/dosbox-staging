name:        Feature request
description: Suggest an idea (a new feature or other improvement)
title:       Think about the title, twice
labels:      enhancement
type:        feature

body:
  - type: markdown
    id: intro
    attributes:
      value: |
        ## Please fill out the form completely. Incomplete submissions will be closed!
        #### Make sure that you have:
        - provided a descriptive and succinct title
        - have read all questions carefully have answered **all** of them

        [Please consider a donation to the DOSBox Staging project](https://www.dosbox-staging.org/get-involved/#make-a-donation).

  - type: dropdown
    id: version
    attributes:
      label: Which DOSBox Staging version are you using?
      description: |
        Look up the latest version [on our website](https://www.dosbox-staging.org/) or the [downloads page](https://www.dosbox-staging.org/download/). To check your version, check out the startup banner, run `dosbox --version`, or execute the `VER` command inside DOSBox Staging.
      options:
        - 0.83.0
        - 0.82.2
        - Latest dev build
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: What operating system are you using?
      multiple: false
      options:
        - Please select
        - Windows 11
        - Windows 10
        - Windows 8
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Linux x86_64
        - Other
    validations:
      required: true

  - type: input
    id: os_details
    attributes:
      label: Relevant operating system details
      placeholder: "Other relevant details about your OS (e.g., your desktop environment on Linux)"
    validations:
      required: false

  - type: checkboxes
    id: native-os
    attributes:
      label: Are you running DOSBox Staging on a native OS?
      description: We only support running DOSBox Staging on a native OS; running on a guest OS in a VM or hypervisor is not supported.
      options:
        - label: I am running Staging on a native OS
          required: true

  - type: checkboxes
    id: official-linux-release
    attributes:
      label: Are you able to trigger the issue with our official DOSBox Staging release?
      description: We only support our official releases downloaded from our [website](https://www.dosbox-staging.org/download/). We do not support repackaged versions of our software; see [this note](https://www.dosbox-staging.org/download/linux/#unofficial-repackaged-releases) for further info.
      options:
        - label: I am running an official Staging binary, NOT a release installed by my operating system's package manager, or a version repackaged by an external team.
          required: true

  - type: input
    id: hardware
    attributes:
      label: Relevant hardware info
      placeholder: "CPU, GPU, device brand/model (e.g., AMD Ryzen 9 7900X, Nvidia RTX 3060, etc.)"
    validations:
      required: false

  - type: checkboxes
    id: checked-dupes
    attributes:
      label: Have you checked that no other similar issue already exists?
      options:
        - label: I have searched and have not found similar issues.
          required: true


  - type: textarea
    id: related
    attributes:
      label: Is your feature request related to a problem? Please describe.
      placeholder: "E.g., I would love if Staging could do ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      placeholder: "How can we make things better?"
    validations:
      required: false

  - type: textarea
    id: alternative
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: "Similar idea or software"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Add any other context or screenshots about the feature request here
      description: Please avoid pasting in large files; _use attachments or links_ in a [Gist](https://gist.github.com/) instead.
      placeholder: "Screenshots, links, mockups, etc., or provide Gist link"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct and contributing guidelines
      description: By submitting this issue, you agree to follow our [contributing guidelines](https://github.com/dosbox-staging/dosbox-staging/blob/master/docs/CONTRIBUTING.md) and [code of conduct](https://github.com/dosbox-staging/dosbox-staging/blob/master/docs/CODE_OF_CONDUCT.md).
      options:
        - label: Yes, I agree.
          required: true
