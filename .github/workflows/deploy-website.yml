name: Deploy website
permissions: read-all

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch to deploy the website from (last release/* branch for current version)'
        required: true
        default: 'release/0.83.x'
        type: string

      destination_prefix:
        description: 'Deploy to this path prefix (leave empty for the current version)'
        type: string

  workflow_call:
    inputs:
      source_branch:
        description: 'Branch to deploy the website from'
        required: true
        type: string

      destination_prefix:
        description: 'Deploy to this path prefix (leave empty for the current version)'
        type: string

jobs:
  linting:
    uses: ./.github/workflows/linting.yml

  build_and_deploy_website:
    needs: linting
    # linting.yml's own `if:` skips it on same-repo PRs (it's already run on
    # push). Without this guard the dependent job would be skipped too,
    # cascading to skip the deploy when called via workflow_call from a PR.
    if: ${{ always() && (needs.linting.result == 'success' || needs.linting.result == 'skipped') }}
    runs-on: ubuntu-slim
    steps:
      # Local actions are loaded from the workspace. The MkDocs sources can be
      # an older branch without them, so they come from the workflow's own
      # commit. This checkout must come first, as the others nest inside it.
      - name: Check out the repository's actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          submodules: false

      - name: Check out MkDocs sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_branch }}
          submodules: false
          path: dosbox-staging

      - name: Check out organisation GitHub Pages repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACCESS_TOKEN_REPO }}
          repository: dosbox-staging/dosbox-staging.github.io
          ref: master
          submodules: false
          path: dosbox-staging.github.io

      - name: Set up variables
        run: |
          if [[ -z "${{ inputs.destination_prefix }}" ]]; then
            echo "dest_path_prefix=." >> "$GITHUB_ENV"
          else
            echo "dest_path_prefix=preview/${{ inputs.destination_prefix }}" >> "$GITHUB_ENV"
          fi

      # Manual actions/cache rather than setup-python@v5: ubuntu-slim
      # has preinstalled Python we don't want replaced.
      - name: Cache pip downloads
        id:   pip_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('dosbox-staging/extras/documentation/mkdocs-package-requirements.txt') }}

      - name: Report pip cache status
        run:  echo "pip cache hit:" "${{ steps.pip_cache.outputs.cache-hit || 'false' }}"

      - name: Install mkdocs
        run: |
          cd dosbox-staging
          pip3 install --upgrade pip
          # --retries / --timeout: survive intermittent PyPI hiccups.
          pip3 install --retries 5 --timeout 60 \
            -r extras/documentation/mkdocs-package-requirements.txt

      - name: Get current documentation Git hash
        run: |
          cd dosbox-staging
          REV=$(git rev-parse --short HEAD)
          echo "source_git_hash=$REV" >> "$GITHUB_ENV"

      # The privacy plugin downloads every external URL referenced in the
      # docs at build time; a transient 5xx from any source crashes the
      # whole build. Retry the build itself.
      - name: Build documentation
        uses: ./.github/actions/retry
        with:
          cmd: |
            mkdocs build \
              --config-file dosbox-staging/website/mkdocs.yml \
              --site-dir "$RUNNER_TEMP/site"

      - name: Set up Git config
        run: |
          cd dosbox-staging.github.io
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      # Other deploys and the PR preview cleanup push to the same repo. Each
      # attempt redoes the update on top of the latest master, so if another
      # push lands first, ours is rejected and the next attempt starts over.
      - name: Publish new release
        uses: ./.github/actions/retry
        with:
          cmd: |
            set -e
            cd dosbox-staging.github.io

            git fetch origin master
            git reset --hard FETCH_HEAD
            git clean -fdx

            if [[ -d ${{ env.dest_path_prefix }} ]]; then
              (
                cd ${{ env.dest_path_prefix }}
                FILES=$(find . \
                    -not -path '*/\.*'        `# ignore hidden files` \
                    -not -path "."            `# ignore current dir` \
                    -not -path "./static"     `# ignore manually managed 'static' dir` \
                    -not -path "./static/*"   `# ignore manually managed 'static' dir contents` \
                    -not -path "./tools"      `# ignore manually managed 'tools' dir` \
                    -not -path "./tools/*"    `# ignore manually managed 'tools' dir contents` \
                    -not -path "./preview"    `# ignore 'preview' dir` \
                    -not -path "./preview/*"  `# ignore 'preview' dir contents` \
                    -not -path "./README.md"  `# ignore 'README.md'` \
                    -not -path "./CNAME"      `# ignore 'CNAME'` \
                    -not -path "./0.82"       `# ignore earlier documentation versions` \
                    -not -path "./0.82/*"
                )
                echo $FILES | xargs git rm -rf --
              )
            fi

            DEST_PATH=$(pwd)/${{ env.dest_path_prefix }}
            mkdir -p "$DEST_PATH"
            cp -rf "$RUNNER_TEMP"/site/* "$DEST_PATH"
            touch "$DEST_PATH/.nojekyll"

            git add .
            git add .nojekyll

            # Skip if the rebuilt site is byte-identical (e.g. a PR push that
            # only changed non-website files but the PR overall touches
            # website/**, so the workflow still fires).
            if git diff --cached --quiet; then
              echo "No changes to publish."
              exit 0
            fi

            git commit -m "Deployed current website (${{ env.source_git_hash }})"
            git push origin HEAD:master

