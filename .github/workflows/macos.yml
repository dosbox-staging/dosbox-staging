name: macOS builds
permissions: read-all

on:
  push:
    paths-ignore:
      - '.clang-format'
      - '.mdl-styles'
      - '*.md'
      - 'docs/**'
      - 'licenses/**'
      - 'website/**'

  pull_request:
    paths-ignore:
      - '.clang-format'
      - '.mdl-styles'
      - '*.md'
      - 'docs/**'
      - 'licenses/**'
      - 'website/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_release_notes:
    name:    Generate release notes
    runs-on: ubuntu-slim
    if:      github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set common vars
        uses: ./.github/actions/set-common-vars

      - name: Generate release notes HTML
        uses: ./.github/actions/generate-release-notes
        with:
          output_path: release-notes.html
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_hash: ${{ github.sha }}

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-html
          path: release-notes.html
          retention-days: 1

  build_macos_release:
    name:    Release build (${{ matrix.conf.arch }})
    runs-on: ${{ matrix.conf.host }}
    if:      github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        conf:
          - host: macos-26
            arch: x86_64
            max_warnings: 0

          - host: macos-26
            arch: arm64
            max_warnings: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set common vars
        uses: ./.github/actions/set-common-vars

      - name: Set up CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          name_os: "${{ matrix.conf.host }}"
          arch: "${{ matrix.conf.arch }}"

      - name: Log environment
        run: arch -arch=${{ matrix.conf.arch }} ./scripts/ci/log-env.sh

      # Retried because the docs build (OPT_DOCUMENTATION=ON) downloads
      # external assets via the MkDocs Material privacy plugin; a transient
      # 5xx or DNS hiccup on any source crashes the whole build. Wrapping
      # the entire step keeps the change minimal; the cmake build is
      # incremental, so a docs-flake retry skips already-compiled artifacts.
      - name: Build release
        uses: ./.github/actions/retry
        with:
          cmd: |
            set -xeo pipefail
            cmake -DOPT_DOCUMENTATION=ON --preset release-macos-${{ matrix.conf.arch }}
            cmake --build --preset release-macos-${{ matrix.conf.arch }} 2>&1 | tee build.log

      - name: Run tests
        run: |
          set -xo pipefail
          ctest -j 4 --preset release-macos-${{ matrix.conf.arch }} 2>&1 | tee tests.log

      - name: Dump workspace contents
        run: find $RUNNER_WORKSPACE

      - name: Summarize warnings
        env:
          MAX_WARNINGS: ${{ matrix.conf.max_warnings }}
        run:  python3 ./scripts/ci/count-warnings.py -lf build.log

      - name: Verify executable RPATH
        run: |
          set -x
          otool -l build/release-macos-${{ matrix.conf.arch }}/Release/dosbox \
              | grep "path @executable_path/lib"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: dosbox-${{ matrix.conf.arch }}
          path: build/release-macos-${{ matrix.conf.arch }}/Release/dosbox
          overwrite: true

      - name: Upload resources
        uses: actions/upload-artifact@v7
        with:
          name: Resources
          path: build/release-macos-${{ matrix.conf.arch }}/Resources
          overwrite: true

      - name:  Report repo cache usage
        if:    always()
        shell: bash
        run:   gh cache list --limit 50 --sort size_in_bytes --order desc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish_universal_build:
    name:    Publish universal build
    needs:   [build_macos_release, generate_release_notes]
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set common vars
        uses: ./.github/actions/set-common-vars

      - name: Install brew depedencies
        run: HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install --overwrite librsvg

      - name: Download all temporary artifacts
        uses: actions/download-artifact@v8

      - name: Dump workspace contents
        run: find $RUNNER_WORKSPACE

      - name: Package
        run: |
          mv Resources ../
          ./scripts/packaging/create-package.sh \
              -p macos \
              -v $DOSBOX_VERSION_AND_HASH \
              -f \
              "$(pwd)" \
              "$(pwd)"

      - name: Inject external vcpkg dependencies
        run: |
          set -x
          ZIP_NAME=dosbox-vcpkg-deps-macos-universal.zip

          # Retry on transient GitHub release-asset CDN flakes.
          wget -nv --tries=5 --waitretry=10 --retry-connrefused \
            https://github.com/dosbox-staging/dosbox-staging-ext/releases/download/$VCPKG_EXT_DEPS_VERSION/$ZIP_NAME
          unzip $ZIP_NAME -d vcpkg-deps

          LIB_DIR="dist/DOSBox Staging.app/Contents/MacOS/lib"
          mkdir "$LIB_DIR"
          cp vcpkg-deps/release/* "$LIB_DIR"


      - name:  Inject Nuked-SC55-CLAP plugin
        run: |
          set -x
          ZIP_NAME=Nuked-SC55-CLAP-macOS-$NUKED_SC55_CLAP_VERSION.zip

          # Retry on transient GitHub release-asset CDN flakes.
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 \
            https://github.com/johnnovak/Nuked-SC55-CLAP/releases/download/$NUKED_SC55_CLAP_VERSION/$ZIP_NAME -o $ZIP_NAME
          unzip $ZIP_NAME -d nuked-sc55-clap

          PLUGINS_DIR="dist/DOSBox Staging.app/Contents/PlugIns"
          mkdir "$PLUGINS_DIR"
          cp -R nuked-sc55-clap/* "$PLUGINS_DIR"


      - name: Create DMG disk image
        run: |
          ln -s /Applications dist/

          codesign -s "-" "dist/DOSBox Staging.app" --force --deep -v

          hdiutil create \
              -volname "DOSBox Staging" \
              -srcfolder dist \
              -ov \
              -format UDZO "dosbox-staging-macOS-universal-$DOSBOX_VERSION_AND_HASH.dmg"


      - name: Upload DMG disk image
        uses: actions/upload-artifact@v7
        # GitHub automatically zips the artifacts, and there's no option
        # to skip it or upload a file only.
        with:
          name: dosbox-staging-macOS-universal-${{ env.DOSBOX_VERSION_AND_HASH }}
          path: |
            dosbox-staging-macOS-universal-${{ env.DOSBOX_VERSION_AND_HASH }}.dmg
            release-notes.html


  publish_dev_build:
    name:    Publish dev build
    needs:   publish_universal_build
    if:      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      DEV_RELEASE_TAG: dev-latest-macos
      GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set common vars
        uses: ./.github/actions/set-common-vars

      - name: Download DMG disk image
        uses: actions/download-artifact@v8
        with:
          name: dosbox-staging-macOS-universal-${{ env.DOSBOX_VERSION_AND_HASH }}
          path: dist

      - name: Create release assets
        run: |
          # The release notes sit beside the DMG rather than inside it, so they
          # have to be published as a separate asset. Including the version in
          # the name keeps the pruning step below from treating them as stale.
          notes_html="release-notes-$DOSBOX_VERSION_AND_HASH.html"
          mv dist/release-notes.html "dist/$notes_html"

      - name: Publish to the rolling dev release
        run: |
          # Skip if a newer build has already been published. This guards against
          # a cancelled run whose steps still completed, and against an old run
          # being re-run by hand -- either would otherwise prune the newer
          # build's assets away.
          tag_ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$DEV_RELEASE_TAG"
          published=$(gh api "$tag_ref" --jq .object.sha 2>/dev/null || true)

          if [ -n "$published" ]; then
              compare="repos/$GITHUB_REPOSITORY/compare/$published...${{ github.sha }}"
              status=$(gh api "$compare" --jq .status)

              if [ "$status" = "behind" ]; then
                  echo "A newer build is already published; nothing to do."
                  exit 0
              fi
          fi

          # The release itself is created by hand once; CI only refreshes its
          # assets, title and tag.
          #
          # Upload first. The release still advertises the previous build at
          # this point, so failing here leaves the website untouched.
          #
          # The DMG is uploaded as-is, so users no longer have to unpack a zip
          # to get at it.
          gh release upload "$DEV_RELEASE_TAG" dist/*.dmg dist/*.html --clobber

          # The website reads the title to decide which assets are current, so
          # this single edit is the atomic switch over to the new build. Every
          # asset it needs is already uploaded, and nothing before this line is
          # visible to visitors.
          gh release edit "$DEV_RELEASE_TAG" --title "$DOSBOX_VERSION_AND_HASH"

          # A release follows its tag, so moving the tag re-points the release
          # at this commit. Pushes made with GITHUB_TOKEN create no workflow
          # runs, so this doesn't re-trigger any build.
          git push --force origin ${{ github.sha }}:refs/tags/$DEV_RELEASE_TAG

          # Nothing references the previous build's assets any more, so pruning
          # them is housekeeping rather than part of the switch.
          gh release view "$DEV_RELEASE_TAG" --json assets --jq '.assets[].name' \
              | grep -v "$DOSBOX_VERSION_AND_HASH" \
              | xargs -r -I{} gh release delete-asset "$DEV_RELEASE_TAG" {} --yes
